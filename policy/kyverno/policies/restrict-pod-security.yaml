apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: restrict-pod-security

  annotations:
    policies.kyverno.io/title: Restricted Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces security controls for workloads running in the accounts-api
      namespace. Containers must run without privilege escalation,
      privileged mode, or Linux capabilities, and workloads must define
      resource requests and limits.

spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: disallow-privileged

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      validate:
        message: "Privileged containers are not allowed."

        pattern:
          spec:
            containers:
              - securityContext:
                  =(privileged): false

            =(initContainers):
              - securityContext:
                  =(privileged): false

            =(ephemeralContainers):
              - securityContext:
                  =(privileged): false

    - name: disallow-privilege-escalation

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      validate:
        message: "Privilege escalation must be disabled."

        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

    - name: require-run-as-non-root

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      validate:
        message: "Pods must run as a non-root user."

        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: require-drop-all-capabilities

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      validate:
        message: "All Linux capabilities must be dropped."

        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

    - name: require-resource-limits

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      validate:
        message: "CPU and memory requests and limits are required."

        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"

