apiVersion: kyverno.io/v1
kind: ClusterPolicy

metadata:
  name: require-signed-images

  annotations:
    policies.kyverno.io/title: Require Cosign-Signed Images
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Require Cosign keyless signatures for accounts-api images before
      allowing them to run in the accounts-api namespace.

spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30

  rules:
    - name: verify-cosign-signature

      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - accounts-api

      verifyImages:
        - imageReferences:
            - ghcr.io/org/accounts-api*

          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/org/accounts-api/.github/workflows/ci.yaml@refs/heads/main

          mutateDigest: true
          required: true
