apiVersion: v1
kind: Namespace
metadata:
  name: accounts-api
  labels:
    data-classification: pci-adjacent

---
# Valid workload. Should pass the accounts-api security policy.
apiVersion: v1
kind: Pod
metadata:
  name: accounts-api-good
  namespace: accounts-api

spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: accounts-api
      image: ghcr.io/org/accounts-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

---
# Invalid workload. Multiple security requirements are intentionally violated.
apiVersion: v1
kind: Pod
metadata:
  name: accounts-api-bad-privileged
  namespace: accounts-api

spec:
  containers:
    - name: accounts-api
      image: ghcr.io/org/accounts-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

      securityContext:
        privileged: true
        allowPrivilegeEscalation: true

---
# Invalid workload. Security settings are valid, but resource
# requests and limits are missing.
apiVersion: v1
kind: Pod
metadata:
  name: accounts-api-bad-no-limits
  namespace: accounts-api

spec:
  securityContext:
    runAsNonRoot: true

  containers:
    - name: accounts-api
      image: ghcr.io/org/accounts-api@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL

---
# This namespace is outside the accounts-api policy scope.
apiVersion: v1
kind: Namespace
metadata:
  name: other-team-ns

---
# Should not be affected by the accounts-api-specific Kyverno policy.
apiVersion: v1
kind: Pod
metadata:
  name: other-team-privileged-pod
  namespace: other-team-ns

spec:
  containers:
    - name: whatever
      image: nginx:latest

      securityContext:
        privileged: true

