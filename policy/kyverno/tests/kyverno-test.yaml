name: accounts-api-pod-security-tests
policies:
  - ../policies/restrict-pod-security.yaml
resources:
  - resources.yaml
results:
  # Compliant pod: every rule should pass.
  - policy: restrict-pod-security
    rule: disallow-privileged
    resource: accounts-api-good
    kind: Pod
    result: pass
  - policy: restrict-pod-security
    rule: disallow-priv-escalation
    resource: accounts-api-good
    kind: Pod
    result: pass
  - policy: restrict-pod-security
    rule: require-run-as-nonroot
    resource: accounts-api-good
    kind: Pod
    result: pass
  - policy: restrict-pod-security
    rule: require-drop-all-capabilities
    resource: accounts-api-good
    kind: Pod
    result: pass
  - policy: restrict-pod-security
    rule: require-resource-limits
    resource: accounts-api-good
    kind: Pod
    result: pass

  # Privileged pod: must fail the privileged + priv-escalation rules.
  - policy: restrict-pod-security
    rule: disallow-privileged
    resource: accounts-api-bad-privileged
    kind: Pod
    result: fail
  - policy: restrict-pod-security
    rule: disallow-priv-escalation
    resource: accounts-api-bad-privileged
    kind: Pod
    result: fail

  # Missing-limits pod: passes pod-security rules, fails only the limits rule.
  - policy: restrict-pod-security
    rule: disallow-privileged
    resource: accounts-api-bad-no-limits
    kind: Pod
    result: pass
  - policy: restrict-pod-security
    rule: require-resource-limits
    resource: accounts-api-bad-no-limits
    kind: Pod
    result: fail

  # Unlabelled namespace: policy must not evaluate this pod at all -> "skip".
  - policy: restrict-pod-security
    rule: disallow-privileged
    resource: other-team-privileged-pod
    kind: Pod
    result: skip
