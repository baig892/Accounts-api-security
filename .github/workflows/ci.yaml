name: accounts-api-secure-build

# Trunk-based workflow:
# - Pull requests are required for main
# - Builds run again after changes are merged to main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/accounts-api

jobs:
  # Scan the repository for accidentally committed secrets.
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Run SAST, IaC and Kubernetes policy checks before building the image.
  static-analysis:
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/golang p/owasp-top-ten p/secrets

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

      - name: Run Kyverno policy tests
        run: |
          curl -sL https://github.com/kyverno/kyverno/releases/latest/download/kyverno-cli_linux_x86_64.tar.gz \
            | tar xz

          ./kyverno test policy/kyverno/tests

  # Build the image once, scan it and use the same image for signing/publishing.
  build-scan-sign:
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - static-analysis

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      # Images are published only after the vulnerability scan succeeds.
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      # Sign the exact image digest that was scanned and pushed.
      - name: Sign image and attach SBOM
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            ${{ env.IMAGE_NAME }}:${{ github.sha }})

          cosign sign --yes "$DIGEST"

          cosign attach sbom \
            --sbom sbom.cdx.json \
            "$DIGEST"

          cosign attest \
            --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "$DIGEST"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # Deployment is intentionally handled separately.
  #
  # Kubernetes admission policies (Kyverno) are responsible for enforcing
  # that only signed images are allowed to run in the cluster.

