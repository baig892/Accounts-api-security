apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api
  namespace: accounts-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/accounts-api-irsa
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts-api
  labels:
    app: accounts-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: accounts-api

  template:
    metadata:
      labels:
        app: accounts-api

    spec:
      serviceAccountName: accounts-api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: accounts-api

          # Deploy immutable image digests so the running image
          # cannot be changed by moving a registry tag.
          image: ghcr.io/org/accounts-api@sha256:REPLACE_WITH_BUILD_DIGEST

          ports:
            - containerPort: 8443
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          envFrom:
            - secretRef:
                name: accounts-api-db-credentials

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: tmp
          emptyDir: {}

