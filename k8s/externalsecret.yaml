# External Secrets Operator pulls from AWS Secrets Manager using the same IRSA
# identity as the pod (scoped further, read-only, single-secret-path - see
# terraform/iam.tf). The DB credential's source of truth is Secrets Manager;
# nothing sensitive is ever committed, templated, or passed as a CI variable.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: accounts-api
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: accounts-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-db-credentials
  namespace: accounts-api
spec:
  refreshInterval: 1h   # bounds credential staleness after a rotation in Secrets Manager
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: accounts-api-db-credentials
  data:
    - secretKey: DB_USER
      remoteRef: { key: accounts-api/rds, property: username }
    - secretKey: DB_PASSWORD
      remoteRef: { key: accounts-api/rds, property: password }
